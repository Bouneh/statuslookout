name: Download statistics
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Windows release']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: download-statistics
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Verify counter history calculations
        run: python3 -m unittest discover -s tests -p 'test_download_stats.py'
      - name: Collect release counters and render chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/Update-DownloadStats.py
      - name: Publish updated download statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/metrics/downloads.json assets/downloads-monthly.svg assets/downloads-badge.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh release download statistics"
          git pull --rebase origin main
          git push origin HEAD:main
