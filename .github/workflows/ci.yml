name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  streamdeck:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/streamdeck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/streamdeck/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build native Windows application
        run: dotnet build StatusLookout.sln -c Release --nologo
      - name: Run offline behavioral tests
        run: dotnet run --project tests/StatusLookout.Tests -c Release --no-build
      - name: Verify native UI and bundled logos
        run: dotnet run --project src/StatusLookout.Windows -c Release --no-build -- --preview "$env:RUNNER_TEMP/StatusLookout-about.png" --about --french --light
      - name: Verify native feature integration
        run: dotnet run --project src/StatusLookout.Windows -c Release --no-build -- --feature-test "$env:RUNNER_TEMP/StatusLookout-features.json"
      - name: Verify Windows installer lifecycle
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          ./scripts/Publish.ps1 -Runtimes win-x64 -Version $version
          ./scripts/Build-Installer.ps1 -Runtime win-x64 -Version $version
          ./scripts/Test-Installer.ps1 -Installer artifacts/StatusLookout-Setup-win-x64.exe -Version $version
