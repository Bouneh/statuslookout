name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/StatusLookout.Tests -c Release
      - name: Verify native UI and bundled logos
        run: dotnet run --project src/StatusLookout.Windows -c Release -- --preview "$env:RUNNER_TEMP/StatusLookout-about.png" --about --french --light
      - name: Verify native feature integration
        run: dotnet run --project src/StatusLookout.Windows -c Release --no-build -- --feature-test "$env:RUNNER_TEMP/StatusLookout-features.json"
  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-x86, win-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish portable executable and checksum
        shell: pwsh
        run: |
          $version = '0.7.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./scripts/Publish.ps1 -Runtimes '${{ matrix.runtime }}' -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: StatusLookout-${{ matrix.runtime }}
          if-no-files-found: error
          path: |
            artifacts/StatusLookout-${{ matrix.runtime }}.exe
            artifacts/SHA256SUMS-${{ matrix.runtime }}.txt
            artifacts/LICENSE*
            artifacts/THIRD-PARTY-NOTICES*
  streamdeck:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/streamdeck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/streamdeck/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: StatusLookout-streamdeck
          if-no-files-found: error
          path: |
            artifacts/StatusLookout-streamdeck-*.streamDeckPlugin
            artifacts/SHA256SUMS-streamdeck.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, streamdeck]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: StatusLookout-*
          merge-multiple: true
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts -File | ForEach-Object { $_.FullName })
          gh release view $env:GITHUB_REF_NAME --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "StatusLookout $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
