name: Service request
description: Suggest a public service to monitor
body:
  - type: input
    id: name
    attributes:
      label: Service name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official public HTTPS status page
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Public API format, if known
      description: No credentials or private endpoints.
